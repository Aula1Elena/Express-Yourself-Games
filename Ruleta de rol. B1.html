<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>B1 Role-Play Generator</title>
  <style>
    body {
      margin: 0; padding: 0;
      background: #0f172a; font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .container { max-width: 850px; width: 90%; text-align: center; }
    h1 { color: #38bdf8; font-size: 2.2rem; margin-bottom: 5px; }
    p.subtitle { color: #94a3b8; margin-bottom: 30px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background: #1e293b; border: 2px solid #334155; border-radius: 16px; padding: 20px; text-align: left; }
    .card-title { font-size: 0.85rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #f59e0b; margin-bottom: 10px; }
    .card-content { font-size: 1.15rem; font-weight: 600; color: #f8fafc; line-height: 1.4; }
    .grammar-card { border-color: #ec4899; background: rgba(236, 72, 153, 0.1); }
    .grammar-card .card-title { color: #ec4899; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 16px 36px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4); }
    button:hover { transform: scale(1.05); background: #7dd3fc; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎭 B1 Dialogue Generator</h1>
    <p class="subtitle">2 Players act out the scene | 1 Player is the Grammar Judge!</p>
    
    <div class="grid">
      <div class="card">
        <div class="card-title">👥 Characters</div>
        <div class="card-content" id="charText">Click GENERATE to start!</div>
      </div>
      <div class="card">
        <div class="card-title">📍 Situation</div>
        <div class="card-content" id="sitText">Click GENERATE to start!</div>
      </div>
      <div class="card grammar-card">
        <div class="card-title">⭐ Target Grammar (Obligatory)</div>
        <div class="card-content" id="gramText">Click GENERATE to start!</div>
      </div>
    </div>

    <button onclick="generateScene()">GENERATE NEW SCENE 🎲</button>
  </div>

  <script>
    const characters = [
      "A demanding boss & a tired employee",
      "A tourist lost in town & a helpful local",
      "A shop assistant & an unhappy customer",
      "Two friends deciding what to do this weekend",
      "A hotel receptionist & a guest with a problem",
      "A doctor & a patient who feels unwell",
      "A waiter & a customer who was served the wrong food"
    ];

    const situations = [
      "The train/bus was delayed by 45 minutes.",
      "The product is broken and needs to be returned.",
      "They are planning a secret surprise birthday party.",
      "Someone lost a bag with important documents.",
      "They are trying to choose a restaurant for tonight.",
      "One of them is late for an important meeting."
    ];

    const grammar = [
      "Must use First Conditional (If + Present, Will...)",
      "Must use Past Continuous (I was ...ing when...)",
      "Must use at least TWO Phrasal Verbs (e.g. look for, turn on)",
      "Must give advice using SHOULD or IF I WERE YOU...",
      "Must use Present Perfect with ALREADY or JUST",
      "Must use a Modal Verb of Obligation (have to / must)",
      "Must use ALTHOUGH or IN SPITE OF"
    ];

    function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function generateScene() {
      document.getElementById('charText').innerText = getRandom(characters);
      document.getElementById('sitText').innerText = getRandom(situations);
      document.getElementById('gramText').innerText = getRandom(grammar);
    }
  </script>
</body>
</html>
